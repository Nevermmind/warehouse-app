<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成 PWA 图标</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .emoji-input {
            text-align: center;
            margin-bottom: 30px;
        }
        input {
            font-size: 48px;
            width: 100px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
        }
        .preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .icon-preview {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .icon-preview canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .icon-preview p {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .buttons {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #0051D5;
            transform: translateY(-2px);
        }
        .download-link {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .download-link a {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 PWA 图标生成器</h1>

        <div class="emoji-input">
            <label for="emoji">选择 Emoji：</label><br><br>
            <input type="text" id="emoji" value="📦" maxlength="2">
        </div>

        <div class="buttons">
            <button onclick="generateIcons()">生成图标</button>
        </div>

        <div class="preview" id="preview"></div>

        <div class="buttons">
            <button onclick="downloadAll()" id="downloadBtn" style="display:none;">下载所有图标</button>
        </div>

        <div class="download-link" id="downloadLink"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const canvases = {};

        function generateIcons() {
            const emoji = document.getElementById('emoji').value;
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // 绘制背景（iOS 系统蓝）
                ctx.fillStyle = '#007AFF';
                ctx.fillRect(0, 0, size, size);

                // 绘制 emoji
                ctx.font = `${size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, size / 2, size / 2 + size * 0.05);

                // 添加到预览
                const div = document.createElement('div');
                div.className = 'icon-preview';
                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = size;
                previewCanvas.height = size;
                const previewCtx = previewCanvas.getContext('2d');
                previewCtx.drawImage(canvas, 0, 0);

                div.appendChild(previewCanvas);
                div.innerHTML += `<p>${size}x${size}</p>`;
                preview.appendChild(div);

                canvases[size] = canvas;
            });

            // 生成 favicon (32x32)
            const faviconCanvas = document.createElement('canvas');
            faviconCanvas.width = 32;
            faviconCanvas.height = 32;
            const faviconCtx = faviconCanvas.getContext('2d');
            faviconCtx.fillStyle = '#007AFF';
            faviconCtx.fillRect(0, 0, 32, 32);
            faviconCtx.font = '20px Arial';
            faviconCtx.textAlign = 'center';
            faviconCtx.textBaseline = 'middle';
            faviconCtx.fillText(emoji, 16, 17);

            canvases[32] = faviconCanvas;

            document.getElementById('downloadBtn').style.display = 'inline-block';
        }

        function downloadAll() {
            let downloaded = 0;
            const total = sizes.length + 1;

            sizes.forEach(size => {
                const canvas = canvases[size];
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}x${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);

                    downloaded++;
                    if (downloaded === total) {
                        // 下载 favicon
                        const faviconCanvas = canvases[32];
                        faviconCanvas.toBlob(blob => {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'favicon.png';
                            a.click();
                            URL.revokeObjectURL(url);
                        });
                    }
                });
            });

            const link = document.getElementById('downloadLink');
            link.style.display = 'block';
            link.innerHTML = '<p>✅ 图标已生成并下载！</p><p>请将下载的文件复制到 <code>public/icons/</code> 目录</p>';
        }

        // 页面加载时自动生成
        window.onload = generateIcons;
    </script>
</body>
</html>
