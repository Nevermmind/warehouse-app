[build]
  command = "npm run build"
  publish = "dist"

# 指定 Node.js 版本（Vite 7.3.1 要求 Node.js 20.19+ 或 22.12+）
[build.environment]
  NODE_VERSION = "20"

# 如果请求的是 assets 目录下的文件但找不到，直接返回 404，不要跳转到 index.html
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA 缓存策略
# Service Worker 文件不缓存，确保更新立即生效
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# manifest.json 缓存 1 小时
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# 图标文件长期缓存（1 年）
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scheduled Functions - 定时检查过期提醒
# 每天晚上 7 点（北京时间）执行 (UTC 11:00 = 北京时间 19:00)
[functions.check-expiry]
  schedule = "0 11 * * *"

