[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA 缓存策略
# Service Worker 文件不缓存，确保更新立即生效
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# manifest.json 缓存 1 小时
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# 图标文件长期缓存（1 年）
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scheduled Functions - 定时检查过期提醒
# 每天晚上 7 点（北京时间）执行 (UTC 11:00 = 北京时间 19:00)
[functions.check-expiry]
  schedule = "0 11 * * *"

# Edge Functions 配置
[functions.deepseek]
  runtime = "edge"

